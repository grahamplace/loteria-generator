# Live game socket server. See docs/adr/0001-live-game-realtime-architecture.md
app = "loteria-live-game"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]

# NOTE: `fly deploy` defaults to High Availability and silently creates a
# SECOND machine. That breaks the architecture — ADR 0001 makes the single
# process's event loop the arbiter for every Game, and two instances mean two
# arbiters. There is no fly.toml key that disables it; deploy with:
#
#     fly deploy --ha=false
#
# and check `fly machines list` shows exactly one. `min_machines_running = 1`
# below is a floor, not a ceiling — it does not prevent this.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
